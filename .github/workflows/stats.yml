name: Refresh profile stats

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:           # run it by hand from the Actions tab
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      - name: Generate assets/stats.svg
        env:
          GH_USER: davedumto
          # Optional: add a classic PAT with read:user as the STATS_TOKEN secret
          # to include private contributions. Falls back to the built-in token.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
        run: node scripts/generate-stats.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --cached --quiet || (git commit -m "chore: refresh stats [skip ci]" && git push)
